train_transform:
  augments:
    - __target__: sample
      num_samples: 32768
      num_vertex_samples: 1024

    - __target__: normalize_pc

    # add_noise REMOVED: AugmentPatch creates its own X_0 noise internally.
    # Using sampled_vertices_noisy for seed selection when present (inference-matched).

    - __target__: linear
      scale: [0.8, 1.2]
      rotate_x_range: [-180, 180]
      rotate_y_range: [-180, 180]
      rotate_z_range: [-180, 180]
      scale_p: 0.5
      rotate_p: 0.5

    - __target__: patch
      patch_size: 1000
      num_patches: 8
      train_cvm_network: False
      sigma_H: 0.02
      noise_type: "gaussian"

validate_transform: &validate_transform
  augments:
    - __target__: sample
      num_samples: 32768
      num_vertex_samples: 1024

    - __target__: normalize_pc

    - __target__: add_noise
      noise_std_min: 0.005
      noise_std_max: 0.020

    - __target__: patch
      patch_size: 1000
      num_patches: 8
      train_cvm_network: False
      sigma_H: 0.02
      noise_type: "gaussian"

predict_transform: *validate_transform
