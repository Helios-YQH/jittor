mode: train
debug: False

components:
  data: train
  transform: vm_stage1
  system: vm
  model: vm_stage1

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0001

trainer:
  epochs: 15
  run_name: "stage2_vm2"
  patience: 0
  scheduler:
    type: cosine_warm_restart
    lr_min: 0.000001
    T_0: 10
    T_mult: 2
    warmup_epochs: 3
    warmup_start_lr: 0.00001
