mode: train
debug: False

components:
  data: train
  transform: vm
  system: vm
  model: vm

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.0001

trainer:
  epochs: 250
  run_name: ""
  # patience: 50
  scheduler:
    type: cosine_warm_restart
    lr_min: 0.000001
    T_0: 50
    T_mult: 2
    warmup_epochs: 3
    warmup_start_lr: 0.00001

  # Phase 1: Full parameter training with Gaussian noise (matches paper)
  # All parameters trainable — no freeze at start
