mode: train
debug: False
# Set this to the Phase 1 checkpoint_latest.pkl path before running
load_ckpt: experiments/vm/PHASE1_RUN_NAME/checkpoint_latest.pkl

components:
  data: train
  transform: vm_phase2
  system: vm
  model: vm

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.00005

trainer:
  epochs: 100
  run_name: "phase2"
  # patience: 30
  scheduler:
    type: cosine_warm_restart
    lr_min: 0.000001
    T_0: 25
    T_mult: 2
    warmup_epochs: 2
    warmup_start_lr: 0.000005

  # Phase 2: DistanceModule training + joint fine-tune with mixed noise
  # Phase 2a (epoch 0-50): freeze VM1/VM2 → train DistanceModule (Eq.14 with Term 2)
  # Phase 2b (epoch 50-100): unfreeze all → joint fine-tune (Eq.7 + Eq.10 + Eq.14)
  phases:
    - {start: 0, end: 50, freeze_backbone: true, freeze_distance: false}
    - {start: 50, end: 100, freeze_backbone: false, freeze_distance: false}
