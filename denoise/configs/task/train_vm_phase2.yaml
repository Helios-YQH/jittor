mode: train
debug: False
# Set this to the Phase 1 checkpoint_latest.pkl path before running
load_ckpt: experiments/vm/PHASE1_RUN_NAME/checkpoint_latest.pkl

components:
  data: train_phase2
  transform: vm_phase2
  system: vm
  model: vm

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.00005

trainer:
  epochs: 18
  run_name: "phase2"
  scheduler:
    type: cosine_warm_restart
    lr_min: 0.000001
    T_0: 18
    T_mult: 1
    warmup_epochs: 1
    warmup_start_lr: 0.000005

  # Tight Phase 2: 5e DM warmup (no Term2) + 13e joint finetune (mixed noise)
  phases:
    - {start: 0, end: 5, freeze_backbone: true, freeze_distance: false}
    - {start: 5, end: 18, freeze_backbone: false, freeze_distance: false}
