mode: train
debug: False
load_ckpt: experiments/vm/checkpoint_20260719_232813/checkpoint_latest.pkl

components:
  data: train_phase2
  transform: vm_phase2
  system: vm
  model: vm

loss:
  loss: 1.0

optimizer:
  __target__: adam
  lr: 0.00005

trainer:
  epochs: 30
  run_name: "phase2"
  scheduler:
    type: cosine_warm_restart
    lr_min: 0.000001
    T_0: 25
    T_mult: 1
    warmup_epochs: 3
    warmup_start_lr: 0.000005

  # Phase 2: 5e DM warmup (Term1+Term2, 2 Euler steps) + 25e joint finetune (mixed noise)
  phases:
    - {start: 0, end: 5, freeze_backbone: true, freeze_distance: false}
    - {start: 5, end: 30, freeze_backbone: false, freeze_distance: false}
